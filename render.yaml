services:
  - type: web
    name: deutschfordisch-server
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GROQ_API_KEY
        sync: false # Requires manual entry in Render Dashboard for security
      - key: STORAGE_PATH
        value: /var/lib/data
      - key: PEXELS_API_KEY
        sync: false # Manual entry required in Render
      - key: NODE_VERSION
        value: 18.0.0
    disk:
      name: uploads-data
      mountPath: /var/lib/data
      sizeGB: 1
